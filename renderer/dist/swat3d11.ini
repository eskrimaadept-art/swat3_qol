; SWAT 3 Direct3D 11 renderer - settings
; Put this file next to swat.exe. Delete a line to use the default.

[Display]
; 1 = fill the monitor (borderless, alt-tab friendly), 0 = normal window
Fullscreen=1
; Output size in pixels. 0 = use the monitor's resolution.
OutputWidth=0
OutputHeight=0
; Window size when Fullscreen=0
WindowWidth=1280
WindowHeight=720
; 1 = sync to the monitor refresh (recommended for an old game), 0 = uncapped
VSync=1
; Anti-aliasing: 0 = off, 2, 4 or 8
MSAA=0
; Texture sharpness at angles: 1 = off, 2, 4, 8, 16
Anisotropy=8
; 1 = smooth texture mipmaps (less shimmering), 0 = off
Mipmaps=1
; Horizontal field of view in degrees. 0 = the game's own (about 91 on a 16:9 screen).
; Try 100-110 for a wider view. Scopes and the Optiwand zoom keep working.
FieldOfView=0
; 1 = smooth scaling of menus/HUD, 0 = sharp pixels
SmoothUI=1

[Game]
; These settings give the ORIGINAL swat.exe what the Last Resort swat.exe had built in.
; (With the Last Resort exe they simply confirm what is already there.)
; 0 = change nothing in the game itself
Enabled=1
; 1 = the game's own video options offer widescreen and other sizes (the original game only
; offers 640x480, 800x600, 1024x768, 1280x1024 and 1600x1200). Pick your resolution there.
InGameResolutions=1
; Resolution missions run at:
;   game      = whatever is chosen in the game's video options (see above)
;   desktop   = always your monitor's resolution, whatever the game's option says
;   1920x1080 = always this size (any size up to 2048 each way)
; Menus are not affected: they stay 4:3 with black bars at the sides.
MissionResolution=game
; 1 = skip the intro videos when the game starts (same as the game's -nointro switch).
SkipIntro=1
; Largest texture the game will load, in pixels: 256 = original game, 1024 = Last Resort.
; Allowed: 256, 512, 1024, 2048, 4096. Anything larger than this stops the game with
; "Texture ... is an invalid size". Only matters for mods with high-resolution textures.
MaxTextureSize=2048
; How far you can see before the world is cut off: 1400 = original game, 2800 = Last Resort.
DrawDistance=2800

[UI]
; 1 = offer extra small resolutions (e.g. 1067x600) to the game
ExtraResolutions=1

[Controls]
; Key that opens the SWAT 4-style command menu.
; RMOUSE, MMOUSE, LMOUSE, XMOUSE / YMOUSE (side buttons), a letter (e.g. Q), F1-F12, TAB,
; or a key code number like in swat.cfg. NONE turns the menu off.
ContextMenuKey=RMOUSE
; Team selection (SWAT 4 / Ready or Not style). The command menu opens straight into the
; selected team's orders, coloured gold (Element), red (Red team) or blue (Blue team).
; "<< All commands" at the top of the menu goes back to the full menu (reports etc.).
; Key that cycles Element -> Red -> Blue. XMOUSE = mouse button 4 (side button).
TeamCycleKey=XMOUSE
; Optional keys that pick one team directly (NONE = not used).
TeamElementKey=NONE
TeamRedKey=NONE
TeamBlueKey=NONE
; 1 = open the menu at the selected team's orders, 0 = always open at the top level
OpenAtSelectedTeam=1
; 1 = reports that fit what you are aiming at (suspect secured/evacuate, down, neutralized,
; hostage contact...) are listed in green at the top of the team menu, so you don't have
; to go through "All commands" > Report.
ContextReports=1
; 1 = "Stack up" can also be ordered in dynamic mode (it appears at the bottom of the team
; menu, under Breach/Bang). Officers use the stealth stack voice lines.
DynamicStack=1
; Size of the right-click command menu, in percent (100 = the original size, 70 = 30% smaller).
MenuSize=70

[Nametags]
; Show each officer's name above their head (1 = on, 0 = off).
; Red-team officers in red, Blue-team in blue.
Show=1
; Hide names beyond this distance, in game units (roughly inches). 0 = no limit.
MaxDistance=1500
; Text height in pixels. 0 = automatic (screen height / 68, about 16 at 1080p).
TextSize=0

[QuickRestrain]
; Look at a suspect, hostage or civilian who has complied (hands up), get close, and a
; "[F] Restrain" prompt appears. Press your interact key and they are restrained.
; Uses your swat.cfg key bindings. Anywhere else the interact key works as normal.
Enabled=1
; How close you need to be, in game units (about inches).
Reach=80

[Debug]
; 0 = no log, 1 = normal log (swat3d11.log next to swat.exe), 2 = very detailed (slow)
LogLevel=1
; 1 = use the shaders built into the DLL instead of compiling them with Windows' own shader
; compiler at start-up. Only for troubleshooting (try it if the picture is black or wrong).
BuiltInShaders=0
