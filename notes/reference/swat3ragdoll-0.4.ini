; SWAT 3 ragdoll experiment - version 0.4
[Ragdoll]
; 1 = on, 0 = off (the DLL then only passes sound through)
Enabled=1
; Seconds of the game's own death animation before physics takes over.
; 0 = collapse at once, 1.0 = most of the animation plays first
Delay=0.3
; 1.0 = real gravity. Lower = slower, floatier fall
Gravity=1.0
; 0 = bodies slide like on ice, 1 = they stick where they land
Friction=0.6
; 1 = also characters that are down but still alive (may fight with the cuffing animation)
IncludeDowned=0
; How hard a bullet shoves the body. 0 = no push, 1.0 = normal, 2.0 = movie style
BulletPush=1.0
; 0 = someone who was lying wounded and then dies on their own stays as they are (no sudden
;     movement); if you shoot them while they lie there, they do ragdoll
; 1 = they always go limp the moment they die
AlreadyLying=0
